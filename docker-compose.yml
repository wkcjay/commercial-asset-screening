services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      DATA_MODE: sqlite
      SQLITE_DB_PATH: /data/local.db
      RAW_DATA_DIR: /app/data/raw
      ENABLE_AI_MEMO: ${ENABLE_AI_MEMO:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai-compatible}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: reviewer
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sqlite_data:
